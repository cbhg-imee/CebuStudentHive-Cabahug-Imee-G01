{% if user.is_authenticated %}
<div class="card">
  <div class="list-group list-group-flush">
    {% if user.is_student %}
      <div class="list-group-item small fw-semibold text-body-secondary">Feeds</div>
      <a class="list-group-item list-group-item-action side-link {% if request.resolver_match.url_name == 'home' and not active_sort and not active_cat %}active{% endif %}" href="{% url 'dashboard:home' %}"><i class="bi bi-house-door me-2"></i>Home Feed</a>
      <a class="list-group-item list-group-item-action side-link {% if active_sort == 'top' %}active{% endif %}" href="{% url 'dashboard:home' %}?sort=top"><i class="bi bi-patch-check me-2"></i>Top Verified</a>
      <a class="list-group-item list-group-item-action side-link {% if active_sort == 'recent' %}active{% endif %}" href="{% url 'dashboard:home' %}?sort=recent"><i class="bi bi-clock-history me-2"></i>Recent</a>
      <div class="list-group-item small fw-semibold text-body-secondary">Cebu channels</div>
      <a class="list-group-item list-group-item-action side-link {% if active_cat == 'DISCOUNT' %}active{% endif %}" href="{% url 'dashboard:home' %}?cat=DISCOUNT"><i class="bi bi-tag me-2"></i>Student Discounts</a>
      <a class="list-group-item list-group-item-action side-link {% if active_cat == 'STUDY' %}active{% endif %}" href="{% url 'dashboard:home' %}?cat=STUDY"><i class="bi bi-book me-2"></i>Study Spots</a>
      <a class="list-group-item list-group-item-action side-link {% if active_cat == 'EVENT' %}active{% endif %}" href="{% url 'dashboard:home' %}?cat=EVENT"><i class="bi bi-calendar-event me-2"></i>Campus Events</a>
      <a class="list-group-item list-group-item-action side-link {% if active_cat == 'SCHOLARSHIP' %}active{% endif %}" href="{% url 'dashboard:home' %}?cat=SCHOLARSHIP"><i class="bi bi-mortarboard me-2"></i>Scholarships</a>
    {% endif %}
    {% if user.is_admin_role %}
      <div class="list-group-item small fw-semibold text-body-secondary">Admin</div>
      <a class="list-group-item list-group-item-action side-link {% if request.resolver_match.url_name == 'admin_panel' %}active{% endif %}" href="{% url 'dashboard:admin_panel' %}"><i class="bi bi-shield-check me-2"></i>Moderation Queue</a>
    {% endif %}
  </div>
</div>
{% endif %}
